name: QAAGA Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - fix/qaaga-production-ux-auth

permissions:
  contents: read

concurrency:
  group: qaaga-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://xrdudvpmleknomqlcdbc.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_d7m4vOhy66QCwYxlspMZjQ_dyNAdFbM
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript validation
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run browser and API tests
        run: bun run test:browser

      - name: Upload Playwright failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qaaga-playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
